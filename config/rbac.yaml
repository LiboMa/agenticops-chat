# AgenticOps RBAC matrix (MVP-2.6.0). Loaded by agenticops.auth.authz.
#
# permissions: permission item → the users.permissions flags an authenticated user needs
#              (users.permissions is the JSON list ["read","write","admin"] on the users table).
# subjects:    default flags for actors that have no users row.
#              `anonymous` (web with api_auth_enabled=false) is deliberately all-powerful — it is
#              exactly what an unauthenticated deployment allows today.
# rules:       structured deny rules, evaluated alongside the matrix. Four types exist:
#                actor_must_differ_from_field        — str(actor) != getattr(subject, field)      (SoD)
#                actor_must_match_field_unless_admin — actor.key == getattr(subject, field), unless the actor
#                                                      has admin (ownership: only the requester or an admin may act)
#                deny_actor_kind_when_risk_in        — actor.kind == actor_kind and subject.risk_level in risk_levels
#                deny_actor_kind                     — actor.kind == actor_kind (no subject needed)
#              The two field rules are skipped for the anonymous web actor (they need identities).
#              `enforce: always` makes a rule bite even in shadow mode (rbac_enforce=false).
#              Every rule bearing on a permission is evaluated and an `enforce: always` deny wins over a
#              shadow deny and over a missing permission flag; a subject-reading rule REQUIRES a subject —
#              without one the call is denied (fail-closed).
#              This file is validated strictly: any error rejects the WHOLE file and the built-in defaults apply.
version: 1

permissions:
  change.request: [read]
  change.review:  [write]
  change.approve: [write]
  change.reject:  [write]
  change.cancel:  [write]
  change.clarify: [read]
  change.execute: [write]
  plan.approve:   [write]
  plan.reject:    [write]
  plan.execute:   [write]
  plan.edit:      [write]
  audit.read:     [admin]
  issue.note:     [write]   # MVP-2.7.0 S4: append a note to an issue

subjects:
  anonymous: [read, write, admin]
  cli:       [read, write, admin]
  agents:    [read, write]
  im:        [read]
  webhook:   [read]

rules:
  - name: sod-change-approver-not-requester
    permission: change.approve
    type: actor_must_differ_from_field
    field: requested_by
    # skipped for the anonymous web actor (api_auth_enabled=false): SoD needs identities — enable auth to enforce it on the web

  - name: requester-or-admin
    permission: [change.cancel, change.clarify]
    type: actor_must_match_field_unless_admin
    field: requested_by
    # only the CR's requester (or an admin) may cancel/clarify it; skipped for the anonymous web actor

  - name: no-agent-approval-above-l1
    permission: [plan.approve, change.approve]
    type: deny_actor_kind_when_risk_in
    actor_kind: agent
    risk_levels: [L2, L3]
    enforce: always

  - name: no-webhook-approve-or-execute
    permission: [plan.approve, change.approve, plan.execute, change.execute]
    type: deny_actor_kind
    actor_kind: webhook
    enforce: always
    # an external system may open a change (POST /api/changes/intake) but never approve or run one
