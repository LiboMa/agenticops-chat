<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>new-UI-face · 设计系统一览</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="proto.css">
<style>
  body{background:#0B0D20;color:#ECE8DD}
  .intro{max-width:1180px;margin:0 auto;padding:24px 20px 6px}
  .intro h1{font-size:28px;margin:0 0 6px;letter-spacing:-.01em} .intro p{margin:4px 0;color:#A3A7C8;max-width:78ch}
  .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;max-width:1400px;margin:14px auto 0}
  .gcol{padding:22px 22px 60px;background:var(--ink);color:var(--chalk)}
  .gcol > h2{font-size:var(--fs-xl);margin:0 0 2px} .gcol > h2 small{font-weight:400;color:var(--faint);font-size:var(--fs-sm);margin-left:8px}
  .gsec{margin-top:26px} .gsec > h3{font-size:var(--fs-sm);font-weight:600;color:var(--faint);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
  .sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
  .sw div{border:1px solid var(--line);border-radius:var(--r-2);overflow:hidden;font-size:var(--fs-xs)}
  .sw i{display:block;height:38px} .sw span{display:block;padding:4px 8px;color:var(--dim)} .sw b{display:block;font-family:var(--num);font-weight:400;color:var(--chalk)}
  .cr td.n{font-family:var(--num);text-align:right} .cr td.lo{color:var(--red)}
  .scale p{margin:2px 0}
  .rule{font-size:var(--fs-sm);color:var(--dim);margin:6px 0 0}
  .sp i{display:inline-block;height:14px;background:var(--mint);opacity:.7;border-radius:2px;vertical-align:middle;margin-right:8px}
  @media (max-width:900px){ .cols{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="intro">
  <h1>设计系统一览</h1>
  <p>new-UI-face 的全部基础：颜色、字、间距，以及每一个组件和它的各种状态。左边是夜间主题，右边是白天主题，用的是同一份 <code>proto.css</code>。</p>
  <p>三条规矩：每一种文字色在每一种底色上的对比度都不低于 4.5:1（下面的表是现算的）；正文和标签不小于 12px；颜色只表达两件事——琥珀是「在等人」，青绿是「agent 在做」。</p>
</div>
<div class="cols">
  <div class="gcol" data-theme="night" id="g-night"></div>
  <div class="gcol" data-theme="day" id="g-day"></div>
</div>

<script src="i18n.js"></script>
<script src="proto.js"></script>
<script>
(function(){
"use strict";
const NF = window.NF;
const states = e => Object.entries(NF.STATES[e]).map(([s, w]) => `<div class="statusline" style="margin-bottom:6px"><b>${NF.STR.zh[`state.${e}.${s}`]}</b><span class="${w === "you" ? "wait" : ""}">${NF.STR.zh["wait." + w]}</span><span class="mono" style="color:var(--faint);margin-left:auto">${s}</span></div>`).join("");
const TOK = [["--ink", "页面底"], ["--solid", "实面"], ["--raise", "抬起的面"], ["--line", "线"], ["--chalk", "正文"], ["--dim", "次要文字"], ["--faint", "标签"],
             ["--amber", "在等人"], ["--mint", "agent 在做"], ["--red", "严重"], ["--violet", "变更"], ["--fill", "主按钮"]];
const prov = c => `<span class="prov ${c ? "code" : "model"}"></span>`;

function contrast(el){
  const cs = getComputedStyle(el), v = n => cs.getPropertyValue(n).trim();
  const rgb = c => { if (c.startsWith("#")){ const h = c.slice(1); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)).concat(1); } const m = c.match(/[\d.]+/g).map(Number); return [m[0], m[1], m[2], m[3] === undefined ? 1 : m[3]]; };
  const over = (f, b) => [0, 1, 2].map(i => f[i] * f[3] + b[i] * (1 - f[3])).concat(1);
  const lum = c => { const f = x => { x /= 255; return x <= .03928 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4; }; return .2126 * f(c[0]) + .7152 * f(c[1]) + .0722 * f(c[2]); };
  const cr = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
  const page = rgb(v("--ink")), bgs = [["页面", page], ["卡片", over(rgb(v("--deck")), page)], ["实面", rgb(v("--solid"))], ["抬起", rgb(v("--raise"))]];
  const fgs = [["正文", "--chalk"], ["次要", "--dim"], ["标签", "--faint"], ["琥珀", "--amber"], ["青绿", "--mint"], ["红", "--red"], ["紫", "--violet"]];
  const cell = r => `<td class="n ${r < 4.5 ? "lo" : ""}">${r.toFixed(2)}</td>`;
  return `<table class="grid cr"><tr><th>文字 ＼ 底</th>${bgs.map(b => `<th style="text-align:right">${b[0]}</th>`).join("")}</tr>
    ${fgs.map(f => `<tr><td style="color:var(${f[1]})">${f[0]} <span class="mono" style="color:var(--faint)">${v(f[1])}</span></td>${bgs.map(b => cell(cr(rgb(v(f[1])), b[1]))).join("")}</tr>`).join("")}
    <tr><td>主按钮上的字</td><td class="n" colspan="4">${cr(rgb(v("--fill-ink")), rgb(v("--fill"))).toFixed(2)}</td></tr></table>`;
}

function render(el, name){
  const cs = getComputedStyle(el);
  el.innerHTML = `<h2>${name}<small>data-theme="${el.dataset.theme}"</small></h2>

  <div class="gsec"><h3>颜色</h3><div class="sw">${TOK.map(([t, n]) => `<div><i style="background:var(${t})"></i><span>${n}<b>${cs.getPropertyValue(t).trim()}</b></span></div>`).join("")}</div>
    <p class="rule">琥珀只用于「在等人」，青绿只用于「agent 在做」和「代码核实」。红只给严重，紫只给变更。</p></div>

  <div class="gsec"><h3>对比度（WCAG，现算）</h3>${contrast(el)}<p class="rule">低于 4.5 的格子会变红。自测页 <code>selftest.html</code> 对同一组数字做断言。</p></div>

  <div class="gsec scale"><h3>字</h3>
    <p style="font-size:var(--fs-3xl);font-weight:650;letter-spacing:-.01em">28　页面里最大的一句话</p>
    <p style="font-size:var(--fs-2xl);font-weight:650">22　一件事的标题</p>
    <p style="font-size:var(--fs-xl)">19　数字卡片里的数</p>
    <p style="font-size:var(--fs-lg)">16　输入框里的字（手机上不会触发放大）</p>
    <p style="font-size:var(--fs-md)">14　正文：部署流水线用的角色给 sg_web 加了一条入站规则。</p>
    <p style="font-size:var(--fs-sm);color:var(--dim)">13　说明和次要内容</p>
    <p style="font-size:var(--fs-xs);color:var(--faint)">12　标签，最小的字</p>
    <p class="num" style="font-size:var(--fs-lg)">I#12　03:52 UTC　1,623　92%　<span style="color:var(--faint);font-family:var(--font);font-size:var(--fs-xs)">编号、时间、计数用仪表数字</span></p>
    <p class="mono" style="font-size:var(--fs-xs);color:var(--faint)">aws ec2 describe-security-groups --group-ids sg-0a41…　<span style="font-family:var(--font)">命令和原始记录用等宽字</span></p></div>

  <div class="gsec sp"><h3>间距和圆角</h3>${[4, 8, 12, 16, 24, 32].map(n => `<p style="margin:3px 0;font-size:var(--fs-xs);color:var(--dim)"><i style="width:${n}px"></i>${n}</p>`).join("")}
    <p class="rule">圆角三档：6（小标签、输入框内的块）、10（按钮、列表项）、16（卡片、弹层）。</p></div>

  <div class="gsec"><h3>按钮</h3>
    <div class="row"><button class="btn primary"><span class="t">验收</span><kbd>A</kbd></button><button class="btn primary holding"><span class="fill" style="width:55%;transition:none"></span><span class="t">按住批准并执行</span><kbd>A</kbd></button><button class="btn primary" disabled><span class="t">验收</span><kbd>A</kbd></button></div>
    <div class="row"><button class="btn"><span class="t">退回</span><kbd>R</kbd></button><button class="btn danger"><span class="t">删除</span></button><button class="btn quiet"><span class="t">取消</span><kbd>Esc</kbd></button><button class="btn sm"><span class="t">关上</span></button><button class="btn" disabled><span class="t">不可用</span></button></div>
    <p class="rule">一页只有一个主按钮。会改动基础设施的主按钮要按住约一秒，按钮被填满才生效。每个按钮上印着它的键。</p></div>

  <div class="gsec"><h3>小件</h3>
    <div class="row"><kbd>J</kbd><kbd>K</kbd><kbd>空格</kbd><kbd>Esc</kbd><span class="ref">I#12</span><span class="sev crit">严重</span><span class="sev warn">高</span><span class="sev info">常规变更 L1</span></div>
    <div class="row"><button class="ev">E1</button><button class="ev">E2</button><span class="tier w">会改动</span><span class="tier">只读</span><button class="chip-btn">全部账户</button><button class="avatar">MA</button></div>
    <div class="row"><span>${prov(true)}代码核实的事实</span><span>${prov(false)}模型的推断</span></div>
    <p class="rule">每句话前面都有出处标记：实心菱形是代码取回或核对过的，空心菱形是模型推断的。</p></div>

  <div class="gsec"><h3>切换和筛选</h3>
    <div class="row"><div class="tabs"><button aria-selected="true"><span class="n">1</span>待决<b class="cnt num">5</b></button><button aria-selected="false"><span class="n">2</span>现场</button><button aria-selected="false"><span class="n">3</span>全景</button></div></div>
    <div class="row"><div class="pills"><button aria-pressed="true">全部</button><button aria-pressed="false">批准<span class="n">3</span></button><button aria-pressed="false">验收<span class="n">1</span></button><button aria-pressed="false">确认<span class="n">1</span></button><button aria-pressed="false">异常</button></div></div></div>

  <div class="gsec"><h3>输入</h3>
    <div class="row"><input class="field" placeholder="说一句为什么，agent 会照着重做" style="max-width:340px"></div>
    <div class="row"><textarea class="field" rows="2" placeholder="备注（只能追加，不能改）" style="max-width:340px"></textarea></div>
    <div class="row"><button class="tickbox" role="checkbox" aria-checked="true">✓</button><button class="tickbox" role="checkbox" aria-checked="false"></button><span style="color:var(--dim);font-size:var(--fs-sm)">验收时逐项打勾</span></div></div>

  <div class="gsec"><h3>「需要你做什么」</h3><p class="ask" style="margin:0"><b>需要你：</b>批准这份方案。批准后立即执行。</p>
    <p class="rule">每页简报的第一句话。说清楚要的是哪一个决定，以及做了之后会发生什么。</p></div>

  <div class="gsec"><h3>队列里的一件事</h3><div style="max-width:244px;display:grid;gap:6px">
    <button class="q crit" aria-selected="true"><span class="r"><span class="id">I#12</span><span>等了 2 小时</span></span><span class="t">安全组 sg_web 把 SSH（22 端口）开给了整个公网</span><span class="need">等你批准</span></button>
    <button class="q warn" aria-selected="false"><span class="r"><span class="id">I#934</span><span>等了 40 分钟</span></span><span class="t">Aurora 和 ALB 的告警已经建好，有两项检查要你看一眼</span><span class="need">等你验收</span></button>
    <button class="q info" aria-selected="false"><span class="r"><span class="id">C#3</span><span>稍后再看</span></span><span class="t">给 web 集群的 6 台机器补上 Project 标签</span><span class="need">等你批准</span></button></div></div>

  <div class="gsec"><h3>数字卡片</h3><div class="trust" style="max-width:520px"><div class="tile"><small>${prov(false)}模型自己的把握</small><b>92%</b></div><div class="tile"><small>${prov(false)}另一个模型复核</small><b class="zh">支持</b></div><div class="tile"><small>${prov(true)}出事的位置</small><b class="zh">已核实</b></div></div></div>

  <div class="gsec"><h3>步骤</h3><ol class="steps">
    <li class="ok"><span class="say">收回 22 端口对公网的那条规则<span class="tier w">会改动</span></span><code class="cmd">aws ec2 revoke-security-group-ingress --group-id sg-0a41… --port 22</code></li>
    <li class="bad"><span class="say">确认堡垒机网段的规则还在<span class="tier">只读</span></span><code class="cmd">aws ec2 describe-security-groups --group-ids sg-0a41…</code></li>
    <li class="skip"><span class="say">从堡垒机连一次 web-1<span class="tier">只读</span></span><code class="cmd">ssm: nc -zv web-1 22</code></li>
    <li><span class="say">还没做的一步<span class="tier">只读</span></span></li></ol>
    <p class="rule">四种状态：做完、失败、跳过、还没做。</p></div>

  <div class="gsec"><h3>检查项</h3><ul class="checks">
    <li><span class="pc">pc-1</span><span>4 个 Aurora 实例各有 CPU 和连接数告警</span><span class="st ok">通过</span></li>
    <li><button class="tickbox" role="checkbox" aria-checked="false"></button><span class="pc">pc-5</span><span>端到端通知测试：收到了，但延迟 94 秒</span><span class="st need">警告</span></li>
    <li><span class="pc">pc-3</span><span>30 分钟内没有新的告警</span><span class="st bad">没通过</span></li>
    <li><span class="pc">pc-4</span><span>执行前先列出来的检查</span><span class="st">执行后由代码核对</span></li></ul></div>

  <div class="gsec"><h3>方案的差异（v2 → v3）</h3><ul class="diff">
    <li class="add"><b>＋</b><span>先确认最近 7 天没有人从公网连过 22 端口</span></li>
    <li class="same"><b>　</b><span>收回 22 端口对公网的那条规则</span></li>
    <li class="chg"><b>～</b><span>从堡垒机连一次 web-1 → 从堡垒机分别连 web-1、web-2、web-3</span></li>
    <li class="del"><b>－</b><span>重启 sshd</span></li></ul></div>

  <div class="gsec"><h3>引用别人的话</h3><blockquote class="quote">不要在工作时间重启。<cite>alice　退回方案 v1 时写的　04:12 UTC</cite></blockquote></div>

  <div class="gsec"><h3>一件事的经过</h3>
    <div class="statusline"><b>方案已出</b><span class="wait">在等你批准　2 小时</span><span>生产账户　us-east-1</span></div>
    <ol class="spine">
      <li class="done"><h3>发现<time>03:56 UTC</time><span class="who">扫描</span></h3><p>${prov(true)}sg_web 的 22 端口对 0.0.0.0/0 开放。</p></li>
      <li class="done"><h3>诊断<time>04:02 UTC</time><span class="who">RCA agent</span></h3><p>${prov(false)}部署流水线加的规则，之后没有收回。</p></li>
      <li class="now"><h3>方案 v2<time>04:08 UTC</time><span class="who">SRE agent</span></h3><p>3 步，其中 1 步会改动。在等你批准。</p>
        <details class="more"><summary>看这一版的每一步</summary><ol class="steps"><li><span class="say">收回 22 端口对公网的那条规则<span class="tier w">会改动</span></span><code class="cmd">aws ec2 revoke-security-group-ingress …</code></li></ol></details></li>
      <li class="bad"><h3>执行<time>—</time></h3><p>失败的阶段长这样。</p></li>
      <li class="closed"><h3>批准</h3><p>${prov(true)}被忽略或被拒绝的事停在它所在的那一步，后面的步骤没有发生。</p></li>
      <li class="todo"><h3>验收</h3></li></ol>
    <p class="rule">圆点五种：做完（薄荷）、现在（琥珀）、出错（红）、停在这里（灰）、还没到（空心）。可以展开的内容用「▸」。</p></div>

  <div class="gsec"><h3>状态栏：后端的 22 个状态怎么说</h3>
    <p class="rule" style="margin:0 0 8px">问题的 10 个状态：</p>${states("issue")}
    <p class="rule" style="margin:12px 0 8px">变更的 12 个状态：</p>${states("change")}
    <p class="rule">每个状态说三件事：它叫什么、在等谁、后端的名字。在等人的用琥珀色。</p></div>

  <div class="gsec"><h3>现场：一条在做的事</h3><div style="max-width:320px;display:grid;gap:6px">
    <div class="lane run" aria-selected="true"><span class="lt"><span class="ag">执行器</span><span class="st">第 2 / 3 步</span></span><span class="ti">执行 I#12</span><span class="sb">安全组 sg_web 把 SSH 开给了整个公网</span><div class="strip"><i class="done"></i><i class="now"></i><i class="todo"></i></div></div>
    <div class="lane held"><span class="lt"><span class="ag">RCA agent</span><span class="st">停住了，等你</span></span><span class="ti">诊断 I#37　lambda-pay 错误率升高</span><div class="strip"><i class="done"></i><i class="done"></i><i class="you"></i><i class="held"></i><i class="todo"></i></div></div>
    <div class="lane wait"><span class="lt"><span class="ag">SRE agent</span><span class="st">在过策略</span></span><span class="ti">I#63 的修复方案草稿</span><div class="strip"><i class="done"></i><i class="wait"></i></div></div>
    <div class="lane stop"><span class="lt"><span class="ag">执行器</span><span class="st">正在回滚</span></span><span class="ti">执行 I#8</span><div class="strip"><i class="done"></i><i class="skip"></i><i class="now"></i></div></div>
    <div class="lane done"><span class="lt"><span class="ag">执行器</span><span class="st">12 分钟前完成</span></span><span class="ti">执行 I#58　清理 web-2 的磁盘</span><div class="strip"><i class="done"></i><i class="done"></i><i class="done"></i></div></div></div>
    <p class="rule">左边的竖条和状态的颜色是一回事：青绿 = agent 在做，琥珀 = 在等（等你、等策略、等时间），红 = 叫停和回滚，灰 = 做完了。步骤条一格一步：做完、正在做、还没到、你插的话、没有执行（虚线）。</p></div>

  <div class="gsec"><h3>现场：一步一步的记录</h3>
    <ol class="lsteps" style="margin-top:0">
      <li class="done"><span class="say"><span class="actm">▸</span>取这个函数周围的关系和最近的变更</span><code class="cmd">get_topology_evidence(I#37)</code></li>
      <li class="done"><span class="say">${prov(true)}05:52 UTC 有一次发布：pay-fn 版本 41 → 42</span><code class="cmd">cloudtrail lookup-events</code></li>
      <li class="done you"><span class="say"><b class="youtag">你</b>先看下游 orders-api 的超时</span></li>
      <li class="now"><span class="say">${prov(false)}收到。先核对这一点，再继续原来的顺序。</span></li>
      <li class="skip"><span class="say"><span class="actm">▸</span>被叫停之后没有执行的步骤<span class="tier w">会改动</span></span><code class="cmd">aws ec2 …</code></li>
      <li class="todo more">后面还有 2 步</li></ol>
    <p class="rule">每一步前面的记号说明它是什么：◆ 代码取到的事实、◇ 模型自己的话、▸ agent 做的动作。你插的话留在记录里。执行按批准的那一版走，不能插话，只能叫停。</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn danger"><span class="fill"></span><span class="t">按住叫停并回滚</span><kbd>A</kbd></button><button class="btn primary"><span class="t">继续</span><kbd>A</kbd></button><button class="btn"><span class="t">先停一下</span><kbd>A</kbd></button></div></div>

  <div class="gsec"><h3>全景：资源的健康只有四个值</h3>
    <div style="display:grid;gap:4px;font-size:var(--fs-sm)">
      <span><i class="hdot" style="background:var(--red)"></i>严重</span><span><i class="hdot" style="background:var(--amber)"></i>有问题</span>
      <span><i class="hdot" style="background:var(--mint)"></i>有事在处理（agent）　<i class="hdot" style="background:var(--violet)"></i>有事在处理（待批的变更）</span>
      <span><i class="hdot" style="background:rgb(var(--star))"></i>未知（没有未结问题）</span></div>
    <p class="rule">没有「健康」这个值：没有未结问题只说明没有发现异常。回到过去看时，按那个时刻算。连线里虚线是模型推断的关系，仅供参考。</p>
    <div class="scrub card" style="position:static;transform:none;width:100%;margin-top:10px"><div class="row"><button class="btn sm"><span class="t">◂</span><kbd>[</kbd></button><button class="btn sm"><span class="t">回放 24 小时</span><kbd>P</kbd></button><button class="btn sm"><span class="t">▸</span><kbd>]</kbd></button><b>03:52 UTC（2 小时前）</b></div>
      <div class="ticks"><i class="signal" style="left:20%"></i><i class="agent" style="left:44%"></i><i class="change cause" style="left:88%"></i><i class="decision" style="left:92%"></i></div><input type="range" min="0" max="240" value="215" aria-label="时间"></div></div>

  <div class="gsec"><h3>表格</h3><table class="grid"><tr><th>编号</th><th>什么事</th><th>级别</th><th>现在</th></tr><tr><td class="num">I#12</td><td>SSH 对公网开放</td><td>严重</td><td>等你批准</td></tr><tr><td class="num">I#37</td><td>lambda-pay 错误率升高</td><td>高</td><td>agent 正在查</td></tr></table></div>

  <div class="gsec"><h3>一块数据的四种状态</h3>
    <div class="card" style="margin-bottom:8px"><div class="state" style="min-height:120px"><div class="skel" style="width:60%;height:22px"></div><div class="skel" style="width:86%;margin-top:14px"></div><p>正在取数据…</p></div></div>
    <div class="card" style="margin-bottom:8px"><div class="state failed" style="min-height:120px"><div class="big">没取到数据</div><p>这不代表没有事情在等你。上一次成功是 06:08 UTC。</p><p><button class="btn"><span class="t">重试</span></button></p></div></div>
    <div class="card"><div class="state" style="min-height:120px"><div class="big">现在没有需要你决定的事</div><p>没有未结问题不等于一切健康：agent 只能看到它被允许看的东西。</p></div></div>
    <p class="rule">失败不是空，空不是健康。计数取不到时显示「—」，不显示 0。</p></div>

  <div class="gsec"><h3>通知和撤回</h3>
    <div class="toast count" style="position:static;transform:none;width:100%;margin-bottom:8px"><span class="spark"></span><span class="msg">已批准 I#12，5 秒后开始执行</span><button>撤回<kbd>Z</kbd></button><i class="cd" style="animation:none;width:62%"></i></div>
    <div class="toast" style="position:static;transform:none;width:100%"><span class="spark"></span><span class="msg">已撤回，什么都没有发生</span></div>
    <p class="rule">系统的回话只在指令条的位置出现。每个决定都有 5 秒的撤回期；新的决定会让上一个立即生效。</p></div>

  <div class="gsec"><h3>动效</h3><p class="rule" style="margin:0">两档时长：0.12 秒（按下、悬停）和 0.2 秒（面板滑入、内容换页）。只用减速曲线。系统设置了「减少动态效果」时全部关闭，只保留「按住批准」的填充，因为它是确认本身，不是装饰。</p></div>`;
