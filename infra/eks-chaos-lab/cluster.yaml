# eksctl cluster configuration for AgenticOps Chaos Lab
# Usage: eksctl create cluster -f cluster.yaml
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: agenticops-chaos-lab
  region: us-east-1
  version: "1.30"
  tags:
    Project: agenticops
    Environment: chaos-lab

iam:
  withOIDC: true

# No NAT gateway (avoids Elastic IP consumption — us-east-1 EIP quota is full).
# Nodes sit in public subnets and reach the internet directly via the IGW.
# Adequate for a throwaway chaos-test cluster.
vpc:
  nat:
    gateway: Disable

managedNodeGroups:
  - name: chaos-lab-ng
    instanceType: t3.medium
    minSize: 1
    maxSize: 3
    desiredCapacity: 2
    volumeSize: 20
    privateNetworking: false   # public subnet + auto public IP (no NAT needed)
    labels:
      role: chaos-lab
    tags:
      Project: agenticops
      Environment: chaos-lab
  - name: agenticops-ng
    instanceType: t3.medium
    minSize: 1
    maxSize: 1
    desiredCapacity: 1
    volumeSize: 20
    privateNetworking: false   # public subnet + auto public IP (no NAT needed)
    labels:
      role: agenticops-app
    taints:
      - key: dedicated
        value: agenticops
        effect: NoSchedule
    tags:
      Project: agenticops
      Environment: chaos-lab

cloudWatch:
  clusterLogging:
    enableTypes:
      - api
      - audit
      - authenticator
      - controllerManager
      - scheduler
    logRetentionInDays: 7

addons:
  - name: amazon-cloudwatch-observability
    version: latest
