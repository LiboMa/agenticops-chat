apiVersion: v1
kind: Service
metadata:
  name: agenticops
  namespace: agenticops
  labels: { app: agenticops }
spec:
  type: ClusterIP          # HARD RULE: never LoadBalancer/NodePort — app stays private
  selector: { app: agenticops }
  ports:
    - name: http
      port: 8000
      targetPort: 8000
