<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="50%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="g3" x1="10%" y1="100%" x2="90%" y2="0%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#DBEAFE" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="40%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#DBEAFE" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Cloud wisp 1 — top arc -->
  <path d="M 8 20 C 16 12, 28 10, 36 16 C 44 22, 48 18, 56 14"
        stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Cloud wisp 2 — main central flow -->
  <path d="M 4 30 C 14 24, 24 22, 32 28 C 40 34, 46 30, 56 26"
        stroke="url(#g2)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Cloud wisp 3 — lower curve -->
  <path d="M 10 42 C 20 38, 30 44, 38 40 C 46 36, 52 40, 60 38"
        stroke="url(#g3)" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Cloud wisp 4 — bottom whisper -->
  <path d="M 14 52 C 24 48, 34 54, 44 50 C 52 46, 56 50, 60 48"
        stroke="url(#g4)" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Neural nodes at intersections -->
  <circle cx="36" cy="16" r="2.5" fill="#3B82F6" opacity="0.85"/>
  <circle cx="32" cy="28" r="2.8" fill="#3B82F6" opacity="0.9"/>
  <circle cx="48" cy="18" r="1.8" fill="#60A5FA" opacity="0.7"/>
  <circle cx="38" cy="40" r="2.2" fill="#3B82F6" opacity="0.75"/>
  <circle cx="56" cy="26" r="1.8" fill="#60A5FA" opacity="0.65"/>
  <circle cx="44" cy="50" r="1.8" fill="#93C5FD" opacity="0.55"/>

  <!-- Neural connections -->
  <line x1="36" y1="16" x2="32" y2="28" stroke="#3B82F6" stroke-width="0.6" opacity="0.35"/>
  <line x1="48" y1="18" x2="56" y2="26" stroke="#3B82F6" stroke-width="0.5" opacity="0.3"/>
  <line x1="32" y1="28" x2="38" y2="40" stroke="#60A5FA" stroke-width="0.5" opacity="0.25"/>
  <line x1="36" y1="16" x2="48" y2="18" stroke="#3B82F6" stroke-width="0.5" opacity="0.25"/>
  <line x1="38" y1="40" x2="44" y2="50" stroke="#93C5FD" stroke-width="0.4" opacity="0.2"/>
  <line x1="56" y1="26" x2="38" y2="40" stroke="#3B82F6" stroke-width="0.4" opacity="0.2"/>
</svg>
